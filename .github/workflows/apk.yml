name: Crear APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP
        run: |
          ls -la
          ZIP="$(ls *.zip | head -1)"
          echo "Usando: $ZIP"
          unzip -q -o "$ZIP" -d proyecto
          ls -la proyecto

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        working-directory: proyecto
        run: npm install

      - name: Crear el proyecto Android
        working-directory: proyecto
        run: npx cap add android

      - name: Copiar la app al proyecto Android
        working-directory: proyecto
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: proyecto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mate-ajedrez-apk
          path: proyecto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
